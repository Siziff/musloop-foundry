<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='420' viewBox='0 0 1200 420' role='img' aria-label='Sync: the GM broadcasts decisions, each client renders them on its own audio clock'><defs>
<marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L8,4 L0,8 z' fill='#b8862b'/></marker>
<pattern id='grain' width='6' height='6' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='.6' fill='#2b1d12' opacity='.05'/><circle cx='4' cy='4' r='.5' fill='#2b1d12' opacity='.04'/></pattern>
<linearGradient id='vign' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1a130d' stop-opacity='.10'/><stop offset='.15' stop-color='#1a130d' stop-opacity='0'/><stop offset='.85' stop-color='#1a130d' stop-opacity='0'/><stop offset='1' stop-color='#1a130d' stop-opacity='.12'/></linearGradient>
</defs><rect width='1200' height='420' rx='14' fill='#efe3c7'/><rect width='1200' height='420' rx='14' fill='url(#grain)'/><rect width='1200' height='420' rx='14' fill='url(#vign)'/><rect x='8' y='8' width='1184' height='404' rx='10' fill='none' stroke='#b8862b' stroke-width='2'/><rect x='14' y='14' width='1172' height='392' rx='7' fill='none' stroke='#b8862b' stroke-width='.8' opacity='.7'/><text x='60' y='48' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#b8862b' text-anchor='start' letter-spacing='1.5'>HOW EVERY PLAYER HEARS THE SAME CUE</text><rect x='60' y='75' width='300' height='150' rx='6' fill='#e6d6b3' stroke='#b8862b' stroke-width='2' opacity='1'/><text x='78' y='107' font-family='Georgia,"Times New Roman",serif' font-size='18' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>GM client</text><text x='78' y='133' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='normal' font-style='italic' fill='#7a6246' text-anchor='start' letter-spacing='0'>the conductor</text><text x='78' y='163' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#2b1d12' text-anchor='start' letter-spacing='1.5'>→ play part 3</text><text x='78' y='179' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#2b1d12' text-anchor='start' letter-spacing='1.5'>→ cue part 5 @ 7.27 s</text><text x='78' y='195' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#2b1d12' text-anchor='start' letter-spacing='1.5'>→ cancel</text><text x='78' y='211' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#2b1d12' text-anchor='start' letter-spacing='1.5'>→ fade 2.5 s</text><text x='210.0' y='251' font-family='Georgia,"Times New Roman",serif' font-size='12.5' font-weight='normal' font-style='italic' fill='#7a6246' text-anchor='middle' letter-spacing='0'>sends decisions, never audio</text><rect x='430' y='120' width='170' height='60' rx='30' fill='#efe3c7' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='515' y='145' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='middle' letter-spacing='0'>Foundry socket</text><text x='515' y='165' font-family='JetBrains Mono,Menlo,monospace' font-size='9.5' fill='#7a6246' text-anchor='middle' letter-spacing='0.4'>module.musloop-foundry</text><line x1='364' y1='150' x2='426' y2='150' stroke='#b8862b' stroke-width='2' marker-end='url(#ah)' stroke-linecap='round'/><rect x='670' y='75' width='470' height='42' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='684' y='101' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Player 1</text><text x='790' y='101' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>own clock · same loops · renders the cue</text><line x1='604' y1='150' x2='666' y2='96.0' stroke='#b8862b' stroke-width='1.6' marker-end='url(#ah)' stroke-linecap='round'/><rect x='670' y='129' width='470' height='42' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='684' y='155' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Player 2</text><text x='790' y='155' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>own clock · same loops · renders the cue</text><line x1='604' y1='150' x2='666' y2='150.0' stroke='#b8862b' stroke-width='1.6' marker-end='url(#ah)' stroke-linecap='round'/><rect x='670' y='183' width='470' height='42' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.5' opacity='1'/><text x='684' y='209' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Player 3</text><text x='790' y='209' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>own clock · same loops · renders the cue</text><line x1='604' y1='150' x2='666' y2='204.0' stroke='#b8862b' stroke-width='1.6' marker-end='url(#ah)' stroke-linecap='round'/><rect x='60' y='265' width='1080' height='120' rx='6' fill='none' stroke='#c9b48a' stroke-width='1.5' opacity='1' stroke-dasharray='6 4'/><text x='80' y='296' font-family='Georgia,"Times New Roman",serif' font-size='15' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Late joiner?</text><text x='190' y='296' font-family='Georgia,"Times New Roman",serif' font-size='13.5' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>the player says hello, the GM answers with a snapshot (part, position, pending target) → playback resumes mid-loop.</text><text x='80' y='324' font-family='Georgia,"Times New Roman",serif' font-size='15' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Drift?</text><text x='190' y='324' font-family='Georgia,"Times New Roman",serif' font-size='13.5' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>a snapshot every 20 s; a client re-syncs only if it is off by more than 0.4 s.</text><text x='80' y='352' font-family='Georgia,"Times New Roman",serif' font-size='15' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Volume?</text><text x='190' y='352' font-family='Georgia,"Times New Roman",serif' font-size='13.5' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>per client — timing is shared, loudness is personal.</text></svg>