<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='360' viewBox='0 0 1200 360' role='img' aria-label='Workflow: prepare in musloop, export a zip, import in Foundry, play for everyone'><defs>
<marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L8,4 L0,8 z' fill='#b8862b'/></marker>
<pattern id='grain' width='6' height='6' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='.6' fill='#2b1d12' opacity='.05'/><circle cx='4' cy='4' r='.5' fill='#2b1d12' opacity='.04'/></pattern>
<linearGradient id='vign' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1a130d' stop-opacity='.10'/><stop offset='.15' stop-color='#1a130d' stop-opacity='0'/><stop offset='.85' stop-color='#1a130d' stop-opacity='0'/><stop offset='1' stop-color='#1a130d' stop-opacity='.12'/></linearGradient>
</defs><rect width='1200' height='360' rx='14' fill='#efe3c7'/><rect width='1200' height='360' rx='14' fill='url(#grain)'/><rect width='1200' height='360' rx='14' fill='url(#vign)'/><rect x='8' y='8' width='1184' height='344' rx='10' fill='none' stroke='#b8862b' stroke-width='2'/><rect x='14' y='14' width='1172' height='332' rx='7' fill='none' stroke='#b8862b' stroke-width='.8' opacity='.7'/><text x='60' y='48' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#b8862b' text-anchor='start' letter-spacing='1.5'>THE ROUTE OF A TRACK</text><rect x='60.0' y='70' width='250.5' height='120' rx='6' fill='#e6d6b3' stroke='#b8862b' stroke-width='1.8' opacity='1'/><text x='76.0' y='104' font-family='Georgia,"Times New Roman",serif' font-size='18' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>1 · musloop</text><text x='76.0' y='132' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='normal' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>prepare the track</text><text x='76.0' y='160' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>sections · loops · scenes · crossfade</text><line x1='314.5' y1='130.0' x2='332.5' y2='130.0' stroke='#b8862b' stroke-width='2' marker-end='url(#ah)' stroke-linecap='round'/><rect x='336.5' y='70' width='250.5' height='120' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.8' opacity='1'/><text x='352.5' y='104' font-family='Georgia,"Times New Roman",serif' font-size='18' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>2 · Export</text><text x='352.5' y='132' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='normal' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Files → Foundry VTT (zip)</text><text x='352.5' y='160' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>WAV loops + manifest + playlist</text><line x1='591.0' y1='130.0' x2='609.0' y2='130.0' stroke='#b8862b' stroke-width='2' marker-end='url(#ah)' stroke-linecap='round'/><rect x='613.0' y='70' width='250.5' height='120' rx='6' fill='#e6d6b3' stroke='#c9b48a' stroke-width='1.8' opacity='1'/><text x='629.0' y='104' font-family='Georgia,"Times New Roman",serif' font-size='18' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>3 · Foundry desk</text><text x='629.0' y='132' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='normal' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Import ZIP</text><text x='629.0' y='160' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>Data/musloop/&lt;track&gt;/</text><line x1='867.5' y1='130.0' x2='885.5' y2='130.0' stroke='#b8862b' stroke-width='2' marker-end='url(#ah)' stroke-linecap='round'/><rect x='889.5' y='70' width='250.5' height='120' rx='6' fill='#e6d6b3' stroke='#b8862b' stroke-width='1.8' opacity='1'/><text x='905.5' y='104' font-family='Georgia,"Times New Roman",serif' font-size='18' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>4 · Session</text><text x='905.5' y='132' font-family='Georgia,"Times New Roman",serif' font-size='14' font-weight='normal' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>Play · Next · scenes</text><text x='905.5' y='160' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#7a6246' text-anchor='start' letter-spacing='1.5'>synced to every player</text><rect x='60' y='215' width='1080' height='100' rx='6' fill='none' stroke='#c9b48a' stroke-width='1.5' opacity='1' stroke-dasharray='6 4'/><text x='80' y='246' font-family='Georgia,"Times New Roman",serif' font-size='15' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>No module? The same zip holds foundry-playlist.json:</text><text x='80' y='272' font-family='Georgia,"Times New Roman",serif' font-size='13.5' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>unpack into Data/musloop/&lt;track&gt;/ → Playlists → right-click → Import Data. Every section becomes a repeating sound.</text><text x='80' y='296' font-family='Georgia,"Times New Roman",serif' font-size='13.5' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>You lose the boundary-aware transitions, but it works on any host without installing anything.</text></svg>