name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version=$v' module.json > m.json && mv m.json module.json
      - name: Zip module
        run: zip -r module.zip module.json LICENSE README.md scripts templates styles lang vendor
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
