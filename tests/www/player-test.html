<!doctype html>
<meta charset="utf-8">
<title>loop-player test</title>
<body>
<pre id="log"></pre>
<script type="module">
import { MusloopPlayer } from "/module/scripts/loop-player.js";

const log = (...a) => { document.getElementById("log").textContent += a.join(" ") + "\n"; };
window.__log = log;

// Recorder: everything the player sends to its destination is captured as
// mono float32 so the test can inspect seams and transitions offline.
const recCode = `
class Rec extends AudioWorkletProcessor {
  constructor(){ super(); this.on = true; this.port.onmessage = e => { if (e.data === 'stop') this.on = false; }; }
  process(inputs){ const ch = inputs[0][0]; if (this.on && ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor('rec', Rec);`;

window.setup = async () => {
  const ctx = new AudioContext({ sampleRate: 44100 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([recCode], { type: "text/javascript" })));
  const rec = new AudioWorkletNode(ctx, "rec", { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1, channelCountMode: "explicit" });
  const chunks = [];
  rec.port.onmessage = e => chunks.push(e.data);
  const mute = ctx.createGain(); mute.gain.value = 0;
  rec.connect(mute); mute.connect(ctx.destination);
  const bus = ctx.createGain(); bus.connect(rec);
  const p = new MusloopPlayer(ctx, { destination: bus });
  const manifest = await (await fetch("/track/manifest.json")).json();
  await p.load(manifest, async f => (await fetch("/track/" + f)).arrayBuffer());
  window.T = { ctx, p, manifest, chunks, t0: null, events: [] };
  return { loops: manifest.loops.map(L => [L.name, L.duration_sec, L.loop]), state: ctx.state };
};

window.mark = name => { const T = window.T; T.events.push([name, T.ctx.currentTime - T.t0]); };
window.start = (i = 0) => { const T = window.T; T.ctx.resume(); T.t0 = T.ctx.currentTime; T.p.play(i); mark("play " + i); return T.ctx.state; };
window.state = () => { const p = window.T.p; return { playing: p.playing, loopIndex: p.loopIndex, loopCount: p.loopCount, pending: p.pendingTarget(), eta: p.transitionEta(), pos: p.position(), t: window.T.ctx.currentTime - window.T.t0 }; };
window.dump = () => {
  const T = window.T;
  const n = T.chunks.reduce((a, c) => a + c.length, 0);
  const out = new Float32Array(n); let o = 0;
  for (const c of T.chunks) { out.set(c, o); o += c.length; }
  // downsample 4x for transport (11025 Hz is enough to see seams / levels)
  const ds = new Float32Array(Math.floor(n / 4));
  for (let i = 0; i < ds.length; i++) ds[i] = out[i * 4];
  let s = ""; const u8 = new Uint8Array(ds.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(s), sr: 11025, events: T.events };
};
log("ready");
</script>
