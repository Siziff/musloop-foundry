<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='420' viewBox='0 0 1200 420' role='img' aria-label='musloop for Foundry VTT — adaptive music loops at the virtual table'><defs>
<marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L8,4 L0,8 z' fill='#b8862b'/></marker>
<pattern id='grain' width='6' height='6' patternUnits='userSpaceOnUse'><circle cx='1' cy='1' r='.6' fill='#2b1d12' opacity='.05'/><circle cx='4' cy='4' r='.5' fill='#2b1d12' opacity='.04'/></pattern>
<linearGradient id='vign' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1a130d' stop-opacity='.10'/><stop offset='.15' stop-color='#1a130d' stop-opacity='0'/><stop offset='.85' stop-color='#1a130d' stop-opacity='0'/><stop offset='1' stop-color='#1a130d' stop-opacity='.12'/></linearGradient>
</defs><rect width='1200' height='420' rx='14' fill='#efe3c7'/><rect width='1200' height='420' rx='14' fill='url(#grain)'/><rect width='1200' height='420' rx='14' fill='url(#vign)'/><rect x='8' y='8' width='1184' height='404' rx='10' fill='none' stroke='#b8862b' stroke-width='2'/><rect x='14' y='14' width='1172' height='392' rx='7' fill='none' stroke='#b8862b' stroke-width='.8' opacity='.7'/><path d='M40 40 h30 M40 40 v30' stroke='#b8862b' stroke-width='3' fill='none'/><path d='M1160 40 h-30 M1160 40 v30' stroke='#b8862b' stroke-width='3' fill='none'/><path d='M40 380 h30 M40 380 v-30' stroke='#b8862b' stroke-width='3' fill='none'/><path d='M1160 380 h-30 M1160 380 v-30' stroke='#b8862b' stroke-width='3' fill='none'/><text x='84' y='124' font-family='Georgia,"Times New Roman",serif' font-size='36' font-weight='normal' font-style='normal' fill='#b8862b' text-anchor='start' letter-spacing='0'>⚔</text><text x='140' y='128' font-family='Georgia,"Times New Roman",serif' font-size='62' font-weight='bold' font-style='normal' fill='#2b1d12' text-anchor='start' letter-spacing='0'>musloop</text><text x='440' y='128' font-family='Georgia,"Times New Roman",serif' font-size='40' font-weight='normal' font-style='italic' fill='#b8862b' text-anchor='start' letter-spacing='0'>for Foundry VTT</text><text x='80' y='176' font-family='Georgia,"Times New Roman",serif' font-size='21' font-weight='normal' font-style='italic' fill='#2b1d12' text-anchor='start' letter-spacing='0'>The tavern theme loops until the party leaves. The dungeon theme falls in on the beat.</text><text x='80' y='204' font-family='Georgia,"Times New Roman",serif' font-size='15' font-weight='normal' font-style='normal' fill='#7a6246' text-anchor='start' letter-spacing='0'>Every player at the virtual table hears the same thing — the GM only presses Next.</text><rect x='81' y='250' width='178' height='46' rx='5' fill='#5f7f3b' stroke='#1a130d' stroke-width='1' opacity='1'/><text x='170.0' y='278.0' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='bold' font-style='normal' fill='#efe3c7' text-anchor='middle' letter-spacing='0'>Tavern · loop</text><rect x='265' y='250' width='178' height='46' rx='5' fill='#5f7f3b' stroke='#1a130d' stroke-width='1' opacity='1'/><text x='354.0' y='278.0' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='bold' font-style='normal' fill='#efe3c7' text-anchor='middle' letter-spacing='0'>Tavern · loop</text><rect x='449' y='250' width='178' height='46' rx='5' fill='#5f7f3b' stroke='#1a130d' stroke-width='1' opacity='1'/><text x='538.0' y='278.0' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='bold' font-style='normal' fill='#efe3c7' text-anchor='middle' letter-spacing='0'>Tavern · loop</text><rect x='633' y='250' width='198' height='46' rx='5' fill='#9c3b2e' stroke='#1a130d' stroke-width='1' opacity='1'/><text x='732.0' y='278.0' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='bold' font-style='normal' fill='#efe3c7' text-anchor='middle' letter-spacing='0'>Dungeon</text><line x1='632' y1='236' x2='632' y2='310' stroke='#b8862b' stroke-width='2.5' stroke-dasharray='5 4' stroke-linecap='round'/><text x='624' y='228' font-family='Georgia,"Times New Roman",serif' font-size='13' font-weight='bold' font-style='normal' fill='#b8862b' text-anchor='end' letter-spacing='0'>GM presses Next →</text><path d='M230 300 q -60 26 -120 0' fill='none' stroke='#5f7f3b' stroke-width='1.6' opacity='.8'/><path d='M414 300 q -60 26 -120 0' fill='none' stroke='#5f7f3b' stroke-width='1.6' opacity='.8'/><path d='M598 300 q -60 26 -120 0' fill='none' stroke='#5f7f3b' stroke-width='1.6' opacity='.8'/><text x='80' y='338' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#b8862b' text-anchor='start' letter-spacing='1.5'>FREE · OPEN SOURCE · MIT</text><text x='1120' y='338' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#7a6246' text-anchor='end' letter-spacing='1.5'>FOUNDRY VTT v12 · v13</text></svg>